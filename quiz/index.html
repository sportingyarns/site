<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Sporting Yarns Quiz | How well do you know Aussie sport?</title>
<meta name="description" content="A daily quiz on Australian sport's best and most overlooked stories, from @sportingyarns. Ten questions, the yarn behind every answer.">
<meta name="theme-color" content="#0E3A12">
<link rel="icon" type="image/png" href="/assets/favicon-64.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Sporting Yarns">
<meta property="og:title" content="How well do you know Aussie sport?">
<meta property="og:description" content="The daily Sporting Yarns quiz. Ten questions, the yarn behind every answer.">
<meta property="og:url" content="https://sportingyarns.au/quiz/">
<meta property="og:image" content="https://sportingyarns.au/assets/og-quiz.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<script src="/quiz/questions.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lato:wght@400;700;900&display=swap">
<style>
/* Layout: one narrow column on club-green felt, a scoreboard strip on top, a gold-banded question card below. Single deliberate brand look. */
:root {
  --green: #1B5E20;
  --green-deep: #0E3A12;
  --green-line: #2E7A33;
  --gold: #F2B83A;
  --gold-deep: #C8960A;
  --cream: #F5F0E8;
  --red: #E3201B;
  --ink: #0A2A10;
  --muted: #B9CDB6;
  --display: "Bebas Neue", "Oswald", "Arial Narrow", Impact, sans-serif;
  --body: "Lato", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html, body { background: var(--green-deep); color: var(--cream); }
body {
  font-family: var(--body);
  font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  margin: 0;
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  background-image: radial-gradient(ellipse at 50% -10%, rgba(242,184,58,.14), transparent 60%);
  background-attachment: fixed;
}
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand img { width: 64px; height: auto; flex: none; }
.brand-txt { display: grid; gap: 2px; min-width: 0; }
.brand-txt .kicker { font: 900 11px/1 var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
.brand-txt h1 { font: 400 clamp(30px, 8vw, 40px)/0.95 var(--display); letter-spacing: .02em; margin: 0; text-wrap: balance; }

.board { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--ink); border: 2px solid var(--gold-deep); border-radius: 6px; overflow: hidden; }
.board > div { padding: 8px 10px; display: grid; gap: 2px; text-align: center; border-right: 1px solid rgba(242,184,58,.25); }
.board > div:last-child { border-right: 0; }
.board .k { font: 700 10px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.board .v { font: 400 30px/1 var(--display); color: var(--gold); font-variant-numeric: tabular-nums; letter-spacing: .04em; }

.card { background: var(--green); border: 1px solid var(--green-line); border-radius: 8px; overflow: hidden; box-shadow: 0 14px 40px rgba(0,0,0,.35); }
.band { background: var(--gold); color: var(--ink); padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 900 12px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; }
.band .tag { background: var(--ink); color: var(--gold); padding: 4px 8px; border-radius: 3px; white-space: nowrap; }
.inner { padding: 20px 18px 22px; display: grid; gap: 16px; }
.q { font: 700 20px/1.35 var(--body); margin: 0; text-wrap: pretty; }
.opts { display: grid; gap: 10px; }
.opt {
  font: 700 16px/1.3 var(--body); text-align: left; color: var(--cream);
  background: rgba(10,42,16,.55); border: 2px solid var(--green-line); border-radius: 6px;
  padding: 14px 14px 14px 48px; cursor: pointer; position: relative; min-height: 52px;
  transition: border-color .15s, background .15s, transform .1s;
}
.opt::before {
  content: attr(data-letter); position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  font: 400 18px/1 var(--display); background: var(--green-line); color: var(--cream);
}
.opt:hover:not(:disabled) { border-color: var(--gold); background: rgba(10,42,16,.8); }
.opt:active:not(:disabled) { transform: scale(.99); }
.opt:focus-visible, .btn:focus-visible, .link:focus-visible { outline: 3px solid var(--cream); outline-offset: 2px; }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--gold); background: rgba(242,184,58,.18); }
.opt.right::before { background: var(--gold); color: var(--ink); content: "✓"; font-family: var(--body); font-weight: 900; font-size: 15px; }
.opt.wrong { border-color: var(--red); background: rgba(227,32,27,.16); }
.opt.wrong::before { background: var(--red); content: "✕"; font-family: var(--body); font-weight: 900; font-size: 14px; }
.opt.dim { opacity: .55; }

.yarn { border-left: 4px solid var(--red); background: rgba(10,42,16,.5); padding: 12px 14px; border-radius: 0 6px 6px 0; display: grid; gap: 8px; }
.yarn .verdict { font: 400 24px/1 var(--display); letter-spacing: .04em; color: var(--gold); }
.yarn .verdict.miss { color: #FF8A80; }
.yarn p { margin: 0; line-height: 1.5; color: var(--cream); }
.link { color: var(--gold); font-weight: 700; text-decoration: none; border-bottom: 1px solid rgba(242,184,58,.5); justify-self: start; }
.link:hover { border-bottom-color: var(--gold); }

.btn {
  font: 400 22px/1 var(--display); letter-spacing: .08em; border: 0; border-radius: 6px;
  padding: 14px 20px; cursor: pointer; background: var(--gold); color: var(--ink); width: 100%;
}
.btn:hover { background: #FFC94D; }
.btn.ghost { background: transparent; color: var(--cream); border: 2px solid var(--green-line); }
.btn.ghost:hover { border-color: var(--gold); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.intro p { margin: 0; line-height: 1.55; }
.intro ul { margin: 0; padding-left: 20px; line-height: 1.6; color: var(--muted); }

.result { text-align: center; }
.result .big { font: 400 92px/0.9 var(--display); color: var(--gold); letter-spacing: .02em; }
.result .rank { font: 400 30px/1 var(--display); letter-spacing: .04em; }
.result p { margin: 0; line-height: 1.5; color: var(--muted); }
.shot { width: 100%; max-width: 100%; border-radius: 6px; border: 1px solid var(--green-line); display: block; }
.hint { font-size: 13px; color: var(--muted); text-align: center; margin: 0; }
.toast { min-height: 1.2em; font-size: 13px; color: var(--gold); text-align: center; margin: 0; }
.foot { text-align: center; font-size: 13px; color: var(--muted); line-height: 1.5; }
.foot a { color: var(--gold); }

@media (prefers-reduced-motion: no-preference) {
  .inner { animation: rise .35s ease-out; }
  @keyframes rise { from { opacity: .3; transform: translateY(8px); } to { opacity: 1; transform: none; } }
}
@media (max-width: 380px) { .row { grid-template-columns: 1fr; } .q { font-size: 18px; } }
</style>

</head>
<body>
<div class="wrap">
  <header class="brand">
    <img id="logo" alt="Sporting Yarns" src="/assets/logo.webp" width="64" height="61">
    <div class="brand-txt">
      <span class="kicker">@sportingyarns</span>
      <h1>How well do you know Aussie sport?</h1>
    </div>
  </header>

  <div class="board" aria-live="polite">
    <div><span class="k">Question</span><span class="v" id="b-q">–</span></div>
    <div><span class="k">Score</span><span class="v" id="b-s">0</span></div>
    <div><span class="k">Streak</span><span class="v" id="b-k">0</span></div>
  </div>

  <main class="card" id="stage"></main>

  <p class="foot">Questions come from the yarns on <a href="https://www.instagram.com/sportingyarns/" target="_blank" rel="noopener">@sportingyarns</a>. New ones are added as new yarns go up.</p>
</div>

<script>
const BANK = window.SY_QUESTIONS;

const ROUND = 10;
const RANKS = [
  [0, "Loose thread", "Every great yarn starts somewhere. Follow along and come back for another go."],
  [4, "Club stalwart", "Solid. You know your sport. There's still a yarn or two you haven't heard."],
  [7, "Seasoned yarn-spinner", "You could hold a room at the footy club with this lot."],
  [9, "Hall of Famer", "Elite. Share it and see who can match you."]
];
const $ = (id) => document.getElementById(id);
const stage = $("stage");
let deck = [], i = 0, score = 0, streak = 0, best = 0, mode = { label: "Quick ten" };

const shuffle = (arr) => { const a = arr.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const board = () => { $("b-q").textContent = deck.length && i < deck.length ? `${i + 1}/${deck.length}` : "–"; $("b-s").textContent = score; $("b-k").textContent = streak; };
const rankFor = (s) => RANKS.filter(r => s >= r[0]).pop();

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const todayKey = () => new Intl.DateTimeFormat("en-CA", { timeZone: "Australia/Sydney", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
const todayLabel = () => new Intl.DateTimeFormat("en-AU", { timeZone: "Australia/Sydney", day: "numeric", month: "short" }).format(new Date());
function seeded(seedStr) { let h = 2166136261; for (const c of seedStr) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const shuffleWith = (arr, rnd) => { const a = arr.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(rnd() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; };

const SPORT_GROUPS = (() => {
  const counts = {}; BANK.forEach(q => counts[q.s] = (counts[q.s] || 0) + 1);
  const big = Object.keys(counts).filter(k => counts[k] >= 5).sort((x, y) => counts[y] - counts[x]);
  return big.map(k => ({ name: k, match: (q) => q.s === k, n: counts[k] }))
    .concat([{ name: "Everything else", match: (q) => counts[q.s] < 5, n: BANK.filter(q => counts[q.s] < 5).length }]);
})();

function intro() {
  deck = []; i = 0; score = 0; streak = 0; best = 0; board();
  stage.replaceChildren();
  const band = el("div", "band"); band.append(el("span", null, "The Sporting Yarns Quiz"), el("span", "tag", `${BANK.length} questions`));
  const inner = el("div", "inner intro");
  const done = store.get("sy-daily", {});
  const playedToday = done.day === todayKey();
  inner.append(el("p", null, "Australian sport's best and most overlooked stories. Every answer comes with the yarn behind it."));
  const daily = el("button", "btn", playedToday ? `Today's ten: you scored ${done.score}/10` : "Play today's ten"); daily.type = "button"; daily.id = "daily";
  daily.addEventListener("click", () => startDaily());
  const dnote = el("p", "hint", playedToday ? "Same ten for everyone today. New set at midnight, Sydney time. You can replay, but your first score stands." : "Same ten questions for everyone today. Compare scores with your mates.");
  const row = el("div", "row");
  const quick = el("button", "btn ghost", "Quick ten"); quick.type = "button"; quick.id = "quick"; quick.addEventListener("click", startQuick);
  const bysport = el("button", "btn ghost", "Pick a sport"); bysport.type = "button"; bysport.id = "bysport"; bysport.addEventListener("click", sportMenu);
  row.append(quick, bysport);
  inner.append(daily, dnote, row);
  stage.append(band, inner);
}

function sportMenu() {
  stage.replaceChildren();
  const band = el("div", "band"); band.append(el("span", null, "Pick a sport"), el("span", "tag", "10 questions"));
  const inner = el("div", "inner");
  const grid = el("div", "opts");
  SPORT_GROUPS.forEach((g, k) => {
    const b = el("button", "opt", `${g.name} (${g.n})`); b.type = "button"; b.dataset.letter = String(k + 1); b.id = `sport-${k}`;
    b.addEventListener("click", () => { const pool = BANK.filter(g.match); begin(shuffleWith(pool, Math.random).slice(0, Math.min(ROUND, pool.length)), { label: g.name }); });
    grid.append(b);
  });
  const back = el("button", "btn ghost", "Back"); back.type = "button"; back.id = "back"; back.addEventListener("click", intro);
  inner.append(grid, back);
  stage.append(band, inner);
}

function startDaily() {
  const rnd = seeded("sy-" + todayKey());
  begin(shuffleWith(BANK, rnd).slice(0, ROUND), { label: `Today's ten · ${todayLabel()}`, daily: true });
}

function startQuick() {
  const seen = new Set(store.get("sy-seen", []));
  let pool = BANK.filter(q => !seen.has(q.q));
  if (pool.length < ROUND) { store.set("sy-seen", []); pool = BANK.slice(); }
  begin(shuffleWith(pool, Math.random).slice(0, ROUND), { label: "Quick ten" });
}

function begin(list, m) {
  deck = list; mode = m; i = 0; score = 0; streak = 0; best = 0;
  const seen = store.get("sy-seen", []); store.set("sy-seen", seen.concat(deck.map(q => q.q)).slice(-120));
  ask();
}
function start() { mode.daily ? startDaily() : startQuick(); }

function ask() {
  board();
  const item = deck[i];
  stage.replaceChildren();
  const band = el("div", "band"); band.append(el("span", null, `${mode.label} · Q${i + 1}`), el("span", "tag", item.s));
  const inner = el("div", "inner");
  const q = el("p", "q", item.q); q.id = "q-text";
  const opts = el("div", "opts"); opts.setAttribute("role", "group"); opts.setAttribute("aria-labelledby", "q-text");
  const choices = shuffle(item.a.map((t, k) => ({ t, right: k === 0 })));
  choices.forEach((c, k) => {
    const b = el("button", "opt", c.t); b.type = "button"; b.dataset.letter = "ABCD"[k]; b.id = `opt-${k}`;
    b.addEventListener("click", () => answer(c, b, opts, inner, item));
    opts.append(b);
  });
  inner.append(q, opts);
  stage.append(band, inner);
  opts.querySelector("button").focus({ preventScroll: true });
}

function answer(choice, btn, opts, inner, item) {
  const buttons = [...opts.querySelectorAll("button")];
  buttons.forEach(b => b.disabled = true);
  const correctText = item.a[0];
  buttons.forEach(b => { if (b.textContent === correctText) b.classList.add("right"); else if (b !== btn) b.classList.add("dim"); });
  if (choice.right) { score++; streak++; best = Math.max(best, streak); } else { btn.classList.add("wrong"); streak = 0; }
  board();
  const yarn = el("div", "yarn");
  const v = el("span", "verdict" + (choice.right ? "" : " miss"), choice.right ? pick(["Right on the money", "Spot on", "Straight down the middle", "Too easy"]) : `It was ${correctText}`);
  yarn.append(v, el("p", null, item.y));
  if (item.l) { const a = el("a", "link", "Read the full yarn"); a.href = item.l; a.target = "_blank"; a.rel = "noopener"; yarn.append(a); }
  const next = el("button", "btn", i + 1 < deck.length ? "Next question" : "See my score"); next.type = "button"; next.id = "next";
  next.addEventListener("click", () => { i++; i < deck.length ? ask() : finish(); });
  inner.append(yarn, next);
  next.focus({ preventScroll: true });
  yarn.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
const pick = (a) => a[Math.floor(Math.random() * a.length)];

function finish() {
  i = deck.length; board();
  const [, rank, line] = rankFor(score);
  if (mode.daily) { const d = store.get("sy-daily", {}); if (d.day !== todayKey()) store.set("sy-daily", { day: todayKey(), score, of: deck.length }); }
  stage.replaceChildren();
  const band = el("div", "band"); band.append(el("span", null, `Full time · ${mode.label}`), el("span", "tag", `Best streak ${best}`));
  const inner = el("div", "inner result");
  inner.append(el("div", "big", `${score}/${deck.length}`), el("div", "rank", rank), el("p", null, line));
  const img = el("img", "shot"); img.alt = `Score card: ${score} out of ${deck.length}, ${rank}`;
  inner.append(img, el("p", "hint", "Press and hold the card to save it, then share it to your story and tag @sportingyarns."));
  const toast = el("p", "toast"); toast.setAttribute("role", "status");
  const row = el("div", "row");
  const copy = el("button", "btn ghost", "Copy my result"); copy.type = "button"; copy.id = "copy";
  const again = el("button", "btn", "Play another"); again.type = "button"; again.id = "again";
  const text = `${mode.daily ? "Today's ten" : "Sporting Yarns quiz"}: ${score}/${deck.length}, ${rank}. How well do you know Aussie sport? @sportingyarns`;
  copy.addEventListener("click", () => {
    const done = () => { toast.textContent = "Copied. Paste it anywhere."; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallback(text, toast)); else fallback(text, toast);
  });
  again.addEventListener("click", intro);
  row.append(copy, again);
  const follow = el("a", "link", "Follow @sportingyarns for the yarns behind every answer"); follow.href = "https://www.instagram.com/sportingyarns/"; follow.target = "_blank"; follow.rel = "noopener"; follow.style.justifySelf = "center";
  inner.append(row, toast, follow);
  stage.append(band, inner);
  drawCard(score, deck.length, rank, mode.label).then(url => { img.src = url; }).catch(() => { img.hidden = true; });
}

function fallback(text, toast) {
  const ta = el("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.append(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove();
  toast.textContent = ok ? "Copied. Paste it anywhere." : text;
}

async function drawCard(s, n, rank, label) {
  try { await document.fonts.load('400 100px "Bebas Neue"'); await document.fonts.load('900 30px "Lato"'); } catch (e) {}
  const W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  const css = getComputedStyle(document.documentElement);
  const v = (n) => css.getPropertyValue(n).trim();
  const g = x.createRadialGradient(W / 2, 360, 60, W / 2, 360, 1100);
  g.addColorStop(0, "#2A7A30"); g.addColorStop(.6, v("--green")); g.addColorStop(1, v("--green-deep"));
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.save(); x.translate(W / 2, 400);
  for (let k = 0; k < 24; k++) { x.rotate(Math.PI * 2 / 24); x.beginPath(); x.moveTo(0, 0); x.lineTo(1400, -70); x.lineTo(1400, 70); x.closePath(); x.fillStyle = k % 2 ? "rgba(242,184,58,.06)" : "rgba(245,240,232,.025)"; x.fill(); }
  x.restore();
  const logo = $("logo");
  if (logo.complete && logo.naturalWidth) { const lw = 420, lh = lw * logo.naturalHeight / logo.naturalWidth; x.drawImage(logo, W / 2 - lw / 2, 90, lw, lh); }
  x.textAlign = "center"; x.fillStyle = v("--cream");
  x.font = `900 34px ${v("--body")}`; x.fillText("HOW WELL DO YOU KNOW AUSSIE SPORT?", W / 2, 600);
  x.fillStyle = v("--gold"); x.font = `900 30px ${v("--body")}`; x.fillText(label.toUpperCase(), W / 2, 652);
  x.fillStyle = v("--ink"); x.font = `400 300px ${v("--display")}`; x.fillText(`${s}/${n}`, W / 2 + 8, 912);
  x.fillStyle = v("--gold"); x.fillText(`${s}/${n}`, W / 2, 904);
  x.fillStyle = v("--cream"); x.font = `400 92px ${v("--display")}`; x.fillText(rank.toUpperCase(), W / 2, 1030);
  x.strokeStyle = v("--red"); x.lineWidth = 10; x.lineCap = "round"; x.beginPath(); x.moveTo(250, 1072); x.bezierCurveTo(420, 1040, 640, 1110, 830, 1064); x.stroke();
  x.fillStyle = v("--gold"); x.fillRect(0, H - 150, W, 150);
  x.fillStyle = v("--ink"); x.font = `400 64px ${v("--display")}`; x.fillText("CAN YOU BEAT ME?  @SPORTINGYARNS", W / 2, H - 55);
  return c.toDataURL("image/png");
}

intro();
</script>
</body>
</html>
